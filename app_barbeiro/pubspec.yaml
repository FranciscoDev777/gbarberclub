name: app_barbeiro
description: "GBarberClub - Painel administrativo da barbearia"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/Logo.png

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/images/Logo.png"

  adaptive_icon_background: "#0F0F0F"
  adaptive_icon_foreground: "assets/images/Logo.png"