<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body class="form">

    <section>

      <a href="../index.html" class="logo">

      </a>

      <button class="menu-toggle" id="menuToggle">
        &#9776;
      </button>

      <nav class="navbar" id="navbar">

        <a href="../index.html">Home</a>

        <a href="pagina-barbeiros.html">

        </a>

        <a href="Sobre-Nós.html">

        <a href="Portifólio.html">

        <a href="Localização.html">

        </a>

      </nav>

  </header>


  <main class="container">

    <h1>Agende seu horário</h1>

    <div class="centralizar">

      <a href="formulario-agendamento-gustavo.html" class="btn-agendar">
        Agendar Agora
      </a>

    </div>


    <div class="dias-da-semana">

      <div class="grade-dia">

        <h2></h2>

        <div class="grade-horarios">

          <button class="btn horario livre" data-dia="6" data-hora="08:00">
            08:00
          </button>

          <button class="btn horario livre" data-dia="6" data-hora="08:40">
            08:40
          </button>

          <button class="btn horario livre" data-dia="6" data-hora="09:20">
            09:20
          </button>

          <button class="btn horario livre" data-dia="6" data-hora="10:00">
            10:00
          </button>

          <button class="btn horario livre" data-dia="6" data-hora="10:40">
            10:40
          </button>

          <button class="btn horario livre" data-dia="6" data-hora="11:20">
            11:20
          </button>

          <button class="btn horario livre" data-dia="6" data-hora="14:00">
            14:00
          </button>

          <button class="btn horario livre" data-dia="6" data-hora="14:40">
            14:40
          </button>

          <button class="btn horario livre" data-dia="6" data-hora="15:20">
            15:20
          </button>

          <button class="btn horario livre" data-dia="6" data-hora="16:00">
            16:00
          </button>

          <button class="btn horario livre" data-dia="6" data-hora="16:40">
            16:40
          </button>

          <button class="btn horario livre" data-dia="6" data-hora="17:20">
            17:20
          </button>

          <button class="btn horario livre" data-dia="6" data-hora="18:00">
            18:00
          </button>

          <button class="btn horario livre" data-dia="6" data-hora="18:40">
            18:40
          </button>

          <button class="btn horario livre" data-dia="6" data-hora="19:20">
            19:20
          </button>

          <button class="btn horario livre" data-dia="6" data-hora="20:00">
            20:00
          </button>

        </div>

      </div>

    </div>

  </main>


  <script>

    const menuToggle = document.getElementById("menuToggle");
    const navbar = document.getElementById("navbar");

    menuToggle.addEventListener("click", () => {

      navbar.classList.toggle("active");

    });

  </script>


  <script>

    const barbeiro = "gustavo";

    const dias = [
      "Domingo",
      "Segunda",
      "Terça",
      "Quarta",
      "Quinta",
      "Sexta",
      "Sábado"
    ];


    function formatarDataISOlocal(data) {

      const ano = data.getFullYear();

      const mes = String(
        data.getMonth() + 1
      ).padStart(2, "0");

      const dia = String(
        data.getDate()
      ).padStart(2, "0");

      return `${ano}-${mes}-${dia}`;

    }


    function getProximoSabado() {

      const hoje = new Date();

      hoje.setHours(0, 0, 0, 0);

      const data = new Date(hoje);

      const diff =
        (6 - hoje.getDay() + 7) % 7;

      data.setDate(
        hoje.getDate() + diff
      );

      return data;

    }


    document.addEventListener(
      "DOMContentLoaded",
      () => {

        const bloco =
          document.querySelector(".grade-dia");

        const data =
          getProximoSabado();

        const dataISO =
          formatarDataISOlocal(data);

        const nomeDia =
          dias[6];

        const dataFormatada =
          `${String(data.getDate()).padStart(2, "0")}/` +
          `${String(data.getMonth() + 1).padStart(2, "0")}`;

        bloco.setAttribute(
          "data-dataiso",
          dataISO
        );

        bloco.querySelector("h2").innerHTML =
          `${nomeDia} - ${dataFormatada}`;

        const botoes =
          bloco.querySelectorAll(".horario");

        botoes.forEach((btn) => {

          btn.setAttribute(
            "data-dataiso",
            dataISO
          );

        });

        carregarHorarios();

      }
    );


    async function carregarHorarios() {

      try {

        const bloco =
          document.querySelector(".grade-dia");

        const dataISO =
          bloco.getAttribute("data-dataiso");

        if (!dataISO) {
          return;
        }


        const resposta = await fetch(
          `/horarios-livres/${dataISO}/${barbeiro}`
        );


        if (!resposta.ok) {

          throw new Error(
            `Erro HTTP ${resposta.status}`
          );

        }


        const horariosLivres =
          await resposta.json();


        const botoes =
          bloco.querySelectorAll(".horario");


        botoes.forEach((btn) => {

          const hora =
            btn.dataset.hora;

          const livre =
            horariosLivres.includes(hora);


          btn.innerText = hora;

          btn.disabled = !livre;


          if (livre) {

            btn.classList.add("livre");

            btn.classList.remove(
              "reservado"
            );


            btn.style.backgroundColor = "";

            btn.style.borderColor = "";

            btn.style.color = "";

            btn.style.opacity = "1";

            btn.style.cursor = "pointer";

          } else {

            btn.classList.remove(
              "livre"
            );

            btn.classList.add(
              "reservado"
            );


            btn.style.backgroundColor =
              "#555";

            btn.style.borderColor =
              "#666";

            btn.style.color =
              "#bbb";

            btn.style.opacity =
              "0.65";

            btn.style.cursor =
              "not-allowed";

          }

        });


      } catch (erro) {

        console.error(
          "Erro ao carregar horários:",
          erro
        );

      }

    }


    setInterval(
      carregarHorarios,
      3000
    );

  </script>

</body>

</html>
